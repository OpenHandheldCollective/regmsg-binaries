name: Build regmsg binaries

on:
  workflow_dispatch:
  repository_dispatch:
    types: [trigger-workflow]

concurrency:
    group: ${{ github.repository }}-${{ github.workflow }}
    cancel-in-progress: true

permissions:
  contents: write
  actions: write

env:
  LANG: en_US.UTF-8
  LANGUAGE: en_US:en
  LC_ALL: en_US.UTF-8
  FORCE_UNSAFE_CONFIGURE: 1

jobs:
  # Fetch once what every leg would otherwise fetch for itself. Source tarballs
  # are architecture-independent - the Rust host toolchain alone is 188 MB that
  # 19 legs were each pulling - so download them here and hand them over as an
  # artifact. Matrix legs get separate runners with separate disks, so an
  # artifact (or a cache) is the only way to share; an artifact also pays off on
  # the very first run, which a cache cannot, because caches are only saved when
  # a job ends.
  #
  # `-all-source`, not `-source`: pkg-generic.mk defines `-source` as one
  # package's own archive, and only `-all-source` recurses over
  # FINAL_ALL_DEPENDENCIES. regmsg's 188 MB toolchain and its libdrm/alsa/
  # pulseaudio deps are dependencies, so `-source` would bundle just the 55 MB
  # vendored crate tarball and quietly leave the expensive part behind.
  #
  # Not `<target>-source` either - that is buildroot's tree-wide `source` goal,
  # which downloads every enabled package in the tree.
  #
  # The target chosen here only decides which per-triple rust-std lands in the
  # bundle; everything else in the closure is arch-independent, the vendored
  # tarball included - its name carries no arch. Legs on another triple simply
  # fetch their own ~27 MB rust-std on top.
  prepare:
    name: Prepare shared downloads
    runs-on: ubuntu-latest
    steps:
      - name: Login to GHCR
        uses: docker/login-action@v4.0.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Clone repository
        uses: actions/checkout@v6.0.2
        with:
          repository: REG-Linux/REG-WIP
          token: ${{ secrets.REG_TOKEN }}
          submodules: true

      - name: Download sources
        env:
          GH_TOKEN: ${{ secrets.REG_TOKEN }}
        run: |
          # Patch Makefile to use 'reglinux-build:latest' docker image from ghcr.io
          sed -i '/^DOCKER_REPO/ s|reglinux|ghcr.io/reg-linux|' Makefile
          sed -i '/ build . -t /d' Makefile
          # fix for error "failed to set up container networking"
          sed -i 's| --rm | --rm --network host |' Makefile

          # Merge buildroot patches
          CUSTOM_DIR=${{ github.workspace }}/custom BUILDROOT_DIR=${{ github.workspace }}/buildroot ${{ github.workspace }}/scripts/buildroot/mergeToBR.sh

          # Build regmsg from source, or the source we want is never referenced
          sed -i 's/#BR2_PACKAGE_REGLINUX_MSG_BUILD_FROM_SOURCE=y/BR2_PACKAGE_REGLINUX_MSG_BUILD_FROM_SOURCE=y/' configs/reglinux-board.common
          echo "${GH_TOKEN}" > ./gh_token

          # Deliberately NOT installing ci-free-space.mk here: its hook drops a
          # package's downloads once it is installed, and host-rust-bin does get
          # installed on the way to vendoring the crates. That is exactly the
          # 188 MB this job exists to keep.
          make x86_64-build CMD=reglinux-msg-all-source

          # One tarball rather than the raw tree: upload-artifact zips what it
          # is given, and the git cache alone is a few thousand small files.
          tar -cf dl.tar dl
          echo "bundle contents:"
          du -ah --max-depth=2 dl | sort -rh | head -20
          du -h dl.tar

      - name: Upload shared downloads
        uses: actions/upload-artifact@v7.0.0
        with:
          name: regmsg-shared-downloads
          compression-level: 0
          retention-days: 1
          path: dl.tar

  compile-regmsg:
    name: Compile regmsg
    runs-on: ubuntu-latest
    needs: prepare
    strategy:
      matrix:
        cpu: [arm1176jzf_s, cortex_a7, cortex_a9, cortex_a15_a7, cortex_a17, cortex_a35, cortex_a53, cortex_a55, cortex_a72, cortex_a72_a53, cortex_a73_a53, cortex_a75_a55, cortex_a76, cortex_a76_a55, xburst, riscv, saphira, x86_64, x86_64_v3]
        include:
          # MUSL 32 bit
          - target: bcm2835
            cpu: arm1176jzf_s
          # arch: armhf-musl
          - target: h3
            cpu: cortex_a7
          # arch: armv7-musl
          - target: s812
            cpu: cortex_a9
          # arch: armv7-musl
          - target: odroidxu4
            cpu: cortex_a15_a7
          # arch: armv7-musl
          - target: rk3288
            cpu: cortex_a17
          # arch: armv7-musl
          # MUSL 64 bit
          - target: rk3326
            cpu: cortex_a35
          # arch: aarch64-musl
          - target: h616
            cpu: cortex_a53
          # arch: aarch64-musl
          - target: jz4770
            cpu: xburst
          # arch: mipsel-musl
          # GLIBC
          - target: rk3568
            cpu: cortex_a55
          # arch: aarch64-glibc
          - target: bcm2711
            cpu: cortex_a72
          # arch: aarch64-glibc
          - target: rk3399
            cpu: cortex_a72_a53
          # arch: aarch64-glibc
          - target: s922x
            cpu: cortex_a73_a53
          # arch: aarch64-glibc
          - target: sdm845
            cpu: cortex_a75_a55
          # arch: aarch64-glibc
          - target: bcm2712
            cpu: cortex_a76
          # arch: aarch64-glibc
          - target: sm8250
            cpu: cortex_a76_a55
          # arch: aarch64-glibc
          - target: jh7110
            cpu: riscv
          # arch: riscv-glibc
          - target: asahi
            cpu: saphira
          # arch: asahi-glibc
          - target: x86_64
            cpu: x86_64
          # arch: x86_64-glibc
          - target: x86_64_v3
            cpu: x86_64_v3
          # arch: x86_64-glibc
      fail-fast: false

    steps:
      - name: Login to GHCR
        uses: docker/login-action@v4.0.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Clone repository
        id: clone_step
        uses: actions/checkout@v6.0.2
        with:
          repository: REG-Linux/REG-WIP
          token: ${{ secrets.REG_TOKEN }}
          submodules: true

      # REG-WIP owns the workspace root and actions/checkout cleans its
      # checkout path, so this repository - which carries the CI-only
      # scripts/ci-free-space.mk - has to be checked out after it, beside it.
      - name: Clone this repository
        uses: actions/checkout@v6.0.2
        with:
          path: ci

      # Restored after both checkouts, which clean their paths. Failure is not
      # fatal: without the bundle each leg just downloads for itself, which is
      # what it did before this job existed.
      - name: Restore shared downloads
        continue-on-error: true
        uses: actions/download-artifact@v8.0.1
        with:
          name: regmsg-shared-downloads
          path: ${{ github.workspace }}

      - name: Unpack shared downloads
        continue-on-error: true
        run: |
          if [ -f dl.tar ]; then
            tar -xf dl.tar && rm -f dl.tar
            echo "shared downloads restored:"
            du -sh dl
          else
            echo "no shared download bundle; this leg will fetch its own"
          fi

      - name: Compile regmsg
        id: compile_regmsg_step
        env:
          GH_TOKEN: ${{ secrets.REG_TOKEN }}
        run: |
          git config user.name "${{ github.repository_owner }}"
          git config user.email "${{ github.repository_owner }}@users.noreply.github.com"
          git config --local user.password ${{ github.token }}
          regmsgversion="$(sed -n 's/^REGLINUX_MSG_VERSION[[:space:]]*=[[:space:]]*\([0-9a-fA-F]\{7\}\).*/\1/p' package/system/reglinux-msg/reglinux-msg.mk)"
          echo "regmsgversion=$regmsgversion"
          echo "regmsgversion=$regmsgversion" >> "$GITHUB_OUTPUT"

          [ "$(curl -o /dev/null -s -Iw '%{http_code}' -L "https://github.com/REG-Linux/regmsg-binaries/releases/download/${regmsgversion}/reglinux-msg-${regmsgversion}-${{ matrix.cpu }}.tar.xz")" -eq 200 ] && skip=y
          if [ -z "$skip" ]; then
            # Patch Makefile to use 'reglinux-build:latest' docker image from ghcr.io
            sed -i '/^DOCKER_REPO/ s|reglinux|ghcr.io/reg-linux|' Makefile
            sed -i '/ build . -t /d' Makefile
            
            # Disable CCACHE
            sed -i '/BR2_CCACHE/d' configs/reglinux-board.common
            
            # Merge buildroot patches
            CUSTOM_DIR=${{ github.workspace }}/custom BUILDROOT_DIR=${{ github.workspace }}/buildroot ${{ github.workspace }}/scripts/buildroot/mergeToBR.sh

            # After each package is installed, delete downloaded files.
            #
            # Via local.mk, which buildroot includes before every package .mk,
            # rather than sed'ing buildroot/package/pkg-generic.mk: that file is
            # owned by custom/package/pkg-generic.mk.patch, so the next make
            # re-runs mergeToBR.sh over the edit and aborts on the MD5 check -
            # which is why the old version also had to strip the `merge`
            # dependency out of the Makefile to survive. The hook version also
            # keeps a tarball a host/target twin still needs, instead of
            # deleting it and downloading it a second time.
            mkdir -p "output/${{ matrix.target }}"
            cp ci/scripts/ci-free-space.mk "output/${{ matrix.target }}/local.mk"
            
            # Enable the flag and token to build regmsg from source
            sed -i 's/#BR2_PACKAGE_REGLINUX_MSG_BUILD_FROM_SOURCE=y/BR2_PACKAGE_REGLINUX_MSG_BUILD_FROM_SOURCE=y/' configs/reglinux-board.common
            echo "${GH_TOKEN}" > ./gh_token
            
            # Use cached toolchain if available from REG-Linux/REG-llvm-binaries
            #
            # The key has to change whenever the toolchain would be built
            # differently. hashFiles() cannot see git state, and .gitmodules
            # records only the submodule's path and url - it does NOT change
            # when the buildroot commit is bumped, so keying on it handed back
            # a toolchain built against a different Buildroot. Fold in the
            # commit the superproject actually pins; reading it from the tree
            # (HEAD:buildroot) works regardless of how the submodule checkout
            # is configured.
            buildrootsha="$(git rev-parse HEAD:buildroot)"
            cacheHASHshort="$(printf '%s%s' "${{ hashFiles('custom/package/*llvm*/**') }}" "${buildrootsha}" | sha256sum | cut -c1-7)"
            if curl -s -L "https://github.com/REG-Linux/REG-llvm-binaries/releases/download/toolchain-${{ matrix.cpu }}/toolchain-${{ matrix.cpu }}-${cacheHASHshort}.tar.xz" | tar -xJf - 2>/dev/null
            then
              echo "toolchain-${{ matrix.cpu }}-${cacheHASHshort}.tar.xz extracted"
            else
              echo "toolchain-${{ matrix.cpu }}-${cacheHASHshort}.tar.xz not found"
              jobsandload="-j$(( $(nproc) - 1 ))"
              PARALLEL_BUILD=n DEBUG_BUILD=n CCACHE_DISABLE=1 make ${jobsandload} PKG=alsa-lib ${{ matrix.target }}-pkg
              
              XZ_OPT=-9 tar --ignore-failed-read -cJf "toolchain-${{ matrix.cpu }}-${cacheHASHshort}.tar.xz" output/
              gh release delete toolchain-${{ matrix.cpu }} --cleanup-tag -y --repo REG-Linux/REG-llvm-binaries || :
              gh release create toolchain-${{ matrix.cpu }} --repo REG-Linux/REG-llvm-binaries --latest=false --title "Toolchain cache for ${{ matrix.cpu }} targets" "toolchain-${{ matrix.cpu }}-${cacheHASHshort}.tar.xz"
              echo "Toolchain cache created"
              rm "toolchain-${{ matrix.cpu }}-${cacheHASHshort}.tar.xz"
            fi

            # The toolchain cache tarball carries output/, so re-drop local.mk
            # in case an older cached tree shipped one and overwrote ours.
            cp ci/scripts/ci-free-space.mk "output/${{ matrix.target }}/local.mk"
          
            jobsandload="-j$(( $(nproc) - 1 ))"
            PARALLEL_BUILD=n DEBUG_BUILD=n CCACHE_DISABLE=1 make ${jobsandload} PKG=reglinux-msg ${{ matrix.target }}-pkg

            cd "${{ github.workspace }}/output/${{ matrix.target }}" || exit 1
            cat build/reglinux-msg*/.files-list.txt | cut -d ',' -f 2 | sed -e 's+^./+target/+g' >>reglinux-msg-filelist.txt
            XZ_OPT=-9 tar -cJf "${{ github.workspace }}/reglinux-msg-${regmsgversion}-${{ matrix.cpu }}.tar.xz" --verbatim-files-from -T reglinux-msg-filelist.txt || :
            echo "dorelease=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Upload artifacts
        if: ${{ steps.compile_regmsg_step.outputs.dorelease == 'true' && ! cancelled() }}
        id: upload_artifacts
        uses: actions/upload-artifact@v7.0.0
        with:
          name: reglinux-msg-${{ steps.compile_regmsg_step.outputs.regmsgversion }}-${{ matrix.cpu }}
          compression-level: 0
          path: reglinux-msg-${{ steps.compile_regmsg_step.outputs.regmsgversion }}-*

      - name: Upload full-build.log on failure
        if: failure()
        uses: actions/upload-artifact@v7.0.0
        with:
          name: full-build-log-${{ matrix.target }}
          path: ${{ github.workspace }}/output/${{ matrix.target }}/build/full-build.log

  create_release:
    name: Create release
    needs: compile-regmsg
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v8.0.1
        with:
          pattern: reglinux-msg-*
          path: artifacts
          merge-multiple: true

      # A matrix job cannot aggregate a "did anything build?" flag: every leg
      # writes the same job output and the last one to finish wins, so a leg
      # that skipped the build - because its tarball was already released -
      # left dorelease empty and suppressed the release for every leg that did
      # build. The artifacts are the aggregate: only legs that built something
      # upload one, and the version is already in their file names.
      - name: Decide whether there is anything to release
        id: rel
        run: |
          shopt -s nullglob
          files=(artifacts/reglinux-msg-*.tar.xz)
          if [ ${#files[@]} -eq 0 ]; then
            echo "No new tarballs were built; nothing to release."
            exit 0
          fi
          regmsgversion="$(basename "${files[0]}" | sed -nE 's/^reglinux-msg-([0-9a-f]{7})-.*\.tar\.xz$/\1/p')"
          if [ -z "$regmsgversion" ]; then
            echo "Could not parse regmsg version from ${files[0]}"
            exit 1
          fi
          echo "Releasing ${#files[@]} tarball(s) as ${regmsgversion}"
          echo "regmsgversion=${regmsgversion}" >> "$GITHUB_OUTPUT"

      - name: Create release
        if: ${{ steps.rel.outputs.regmsgversion != '' }}
        uses: softprops/action-gh-release@v3
        with:
          repository: REG-Linux/regmsg-binaries
          token: ${{ secrets.REG_TOKEN }}
          files: artifacts/reglinux-msg-${{ steps.rel.outputs.regmsgversion }}-*
          tag_name: ${{ steps.rel.outputs.regmsgversion }}
          prerelease: false
          make_latest: true
          generate_release_notes: true
          name: regmsg binaries (${{ steps.rel.outputs.regmsgversion }})

      # Keep the release list bounded: the three newest of each family this
      # workflow publishes, older ones deleted along with their tags (the same
      # --cleanup-tag idiom the toolchain cache already uses).
      #
      # The filter is an ALLOWLIST of the tags this workflow itself creates,
      # never a denylist. toolchain-<cpu> caches, hand-made releases and older
      # naming schemes cannot match these patterns, so they are never at risk.
      # Pruning is scoped to the families actually released in this run.
      - name: Prune old releases
        if: ${{ steps.rel.outputs.regmsgversion != '' }}
        env:
          JUST_RELEASED: ${{ steps.rel.outputs.regmsgversion }}
          GH_TOKEN: ${{ secrets.REG_TOKEN }}
        run: |
          set -euo pipefail
          if ! command -v gh >/dev/null 2>&1; then
            echo "::warning::gh is not installed on this runner; skipping release pruning"
            exit 0
          fi
          KEEP=3
          prune() {
            pattern="$1"
            echo "== keeping the ${KEEP} newest releases matching ${pattern}"
            # publishedAt, not createdAt: createdAt is the tagged commit's date, which
            # every release here shares, so sorting on it kept the oldest.
            # Newest first, restrict to this family, then drop the first KEEP.
            # grep is allowed to match nothing, hence the || true.
            doomed="$(gh release list --limit 200 -R REG-Linux/regmsg-binaries --json tagName,publishedAt \
                        --jq 'sort_by(.publishedAt) | reverse | .[].tagName' \
                      | grep -E "${pattern}" | tail -n +$((KEEP + 1)) || true)"
            if [ -z "${doomed}" ]; then
              echo "   nothing to remove"
              return 0
            fi
            printf '%s\n' "${doomed}" | while read -r tag; do
              [ -n "${tag}" ] || continue
              case " ${JUST_RELEASED} " in *" ${tag} "*) echo "   keeping ${tag} (released by this run)"; continue ;; esac
              echo "   deleting ${tag}"
              gh release delete "${tag}" -R REG-Linux/regmsg-binaries --cleanup-tag --yes \
                || echo "::warning::could not delete release ${tag}"
            done
          }
          prune '^[0-9a-f]{7}$'
